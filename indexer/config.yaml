# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: vesta-indexer
description: The Vesta household ledger on Monad
address_format: lowercase
contracts:
  - name: HouseVault
    abi_file_path: abis/HouseVault.json
    events:
      - event: HouseCreated
      - event: MemberJoined
      - event: NameSet
      - event: RentPaid
      - event: RentCollected
      - event: RentShortfall
      - event: ExpenseAdded
      - event: Settled
      - event: SentHome
chains:
  - id: 10143 # Monad testnet
    start_block: 68599004
    contracts:
      - name: HouseVault
        address:
          - 0x1a1fa9b1608bea5cbd8cac3462a81032c8bf6006
